name: sustainability_first
description: >
  A hyperscaler with a 24/7 carbon-free energy commitment and a water
  stewardship target. Willing to wait for power. Scores the 2050 horizon
  because the facility will run for 30 years.

facility:
  mw: 300
  online_year: 2030
  cooling: dry
  acres: 200

horizon: 2050
scenario: rcp85

gates:
  states_include: []
  states_exclude: []
  # Carbon sits in a gap between eGRID2023 subregion values, not a hair off one:
  # NWPP is 632 lb/MWh and the next grid, AZNM, is 704, so 670 is mid-gap. Six of
  # 22 subregions pass: NYUP, CAMX, NEWE, SRVC, RFCE, NWPP.
  # The renewable gate is off. Any gap-respecting value (0.15 or 0.33) leaves 29 to
  # 41 counties once the fixed hazard, fiber and capacity gates apply, and it drops
  # nuclear-led SRVC and RFCE, which a 24/7 carbon-free buyer counts as clean.
  # Renewable share still scores in the energy_carbon pillar.
  max_grid_co2_lb_mwh: 670
  min_renewable_share: null
  max_queue_median_age_years: 6
  min_nearby_capacity_multiple: 5     # plant MW within 100 km must be at least this times facility.mw
  max_water_stress_if_evaporative: 1
  hazard_percentile_max:
    nri_inland_flood_score: 85
    nri_coastal_flood_score: 85
    nri_wildfire_score: 90
    nri_hurricane_score: 90
    nri_tornado_score: null
  exclude_moratorium_active: true
  exclude_moratorium_state_active: false
  min_fiber_share_locations: 0.4
  max_permitting_risk: null             # model probability; null disables
  exclude_air_nonattainment: false
  min_population: 5000

weights:
  energy_carbon: 0.30
  water: 0.25
  climate_resilience: 0.15
  grid_infrastructure: 0.08
  land: 0.05
  community: 0.07
  permitting: 0.10

pillar_floor_percentile: 25

robustness:
  samples: 2000
  concentration: 20
  top_n: 10

portfolio:
  sites: 1
  diversity_keys: [state, grid_subregion]
  diversity_penalty: 0.3

output:
  top_n: 10
  explain: true
  include_excluded: true
