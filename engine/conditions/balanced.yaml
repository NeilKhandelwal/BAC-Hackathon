name: balanced
description: >
  Even weights, moderate gates. The default demo profile.

facility:
  mw: 300
  online_year: 2029
  cooling: dry
  acres: 150

horizon: 2026
scenario: rcp85

gates:
  states_include: []
  states_exclude: []
  max_grid_co2_lb_mwh: null
  min_renewable_share: null
  max_queue_median_age_years: 5
  min_nearby_capacity_multiple: 5     # plant MW within 100 km must be at least this times facility.mw
  max_water_stress_if_evaporative: 2
  hazard_percentile_max:
    nri_inland_flood_score: 90
    nri_coastal_flood_score: 90
    nri_wildfire_score: 95
    nri_hurricane_score: 95
    nri_tornado_score: null
  exclude_moratorium_active: true
  exclude_moratorium_state_active: false
  min_fiber_share_locations: 0.2       # share of FCC broadband locations, mostly homes, with last-mile fiber; a weak proxy for backbone
  max_permitting_risk: null             # needs permitting_discretionary_risk; no model ships, so keep null
  exclude_air_nonattainment: false
  min_population: 5000
  max_pct_protected: null              # 0-1 share of the county in PAD-US GAP 1-2; null disables
  max_tribal_land_share: null          # 0-1 share inside reservations or trust land; null disables

weights:                               # cost 0.15 and the other seven scaled by 0.85: energy is the largest operating cost, and the brief asks for long-term economic viability
  energy_carbon: 0.153
  water: 0.119
  climate_resilience: 0.119
  grid_infrastructure: 0.153
  land: 0.068
  community: 0.085
  permitting: 0.153
  cost: 0.15

pillar_floor_percentile: 10            # guards against a county that fails badly on one pillar; at 20 it turned small
                                       # value-choice differences into drops of hundreds of ranks
pillar_floor_exempt: [permitting]       # three coarse state-level integers; one step moved a county 380 ranks

robustness:
  samples: 2000
  concentration: 20
  top_n: 10

portfolio:
  sites: 1
  diversity_keys: [state, grid_subregion]
  diversity_penalty: 0.3

output:
  top_n: 10
  explain: true
  include_excluded: true
