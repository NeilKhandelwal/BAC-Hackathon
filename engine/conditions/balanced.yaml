name: balanced
description: >
  Even weights, moderate gates. The default demo profile.

facility:
  mw: 300
  online_year: 2029
  cooling: dry
  acres: 150

horizon: 2026
scenario: rcp85

gates:
  states_include: []
  states_exclude: []
  max_grid_co2_lb_mwh: null
  min_renewable_share: null
  max_queue_median_age_years: 5
  min_nearby_capacity_multiple: 5     # plant MW within 100 km must be at least this times facility.mw
  max_water_stress_if_evaporative: 2
  hazard_percentile_max:
    nri_inland_flood_score: 90
    nri_coastal_flood_score: 90
    nri_wildfire_score: 95
    nri_hurricane_score: 95
    nri_tornado_score: null
  exclude_moratorium_active: true
  exclude_moratorium_state_active: false
  min_fiber_share_locations: 0.4
  max_permitting_risk: null             # model probability; null disables
  exclude_air_nonattainment: false
  min_population: 5000

weights:
  energy_carbon: 0.18
  water: 0.14
  climate_resilience: 0.14
  grid_infrastructure: 0.18
  land: 0.08
  community: 0.10
  permitting: 0.18

pillar_floor_percentile: 20

robustness:
  samples: 2000
  concentration: 20
  top_n: 10

portfolio:
  sites: 1
  diversity_keys: [state, grid_subregion]
  diversity_penalty: 0.3

output:
  top_n: 10
  explain: true
  include_excluded: true
