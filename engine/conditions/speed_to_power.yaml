name: speed_to_power
description: >
  A developer with a signed tenant and a 2028 deadline. Interconnection wait
  and permitting risk dominate. Carbon is a constraint on the tenant's side,
  not the developer's.

facility:
  mw: 300
  online_year: 2028
  cooling: hybrid
  acres: 150

horizon: 2026
scenario: rcp85

gates:
  states_include: []
  states_exclude: []
  max_grid_co2_lb_mwh: null
  min_renewable_share: null
  max_queue_median_age_years: 3
  min_nearby_capacity_multiple: 8     # plant MW within 100 km must be at least this times facility.mw
  max_water_stress_if_evaporative: 3
  hazard_percentile_max:
    nri_inland_flood_score: 90
    nri_coastal_flood_score: 90
    nri_wildfire_score: 95
    nri_hurricane_score: 90
    nri_tornado_score: null
  exclude_moratorium_active: true
  exclude_moratorium_state_active: true
  min_fiber_share_locations: 0.3       # share of FCC broadband locations, mostly homes, with last-mile fiber; a weak proxy for backbone
  max_permitting_risk: null             # needs permitting_discretionary_risk; no model ships, so keep null
  exclude_air_nonattainment: false
  min_population: 10000

weights:                               # cost 0.18, a little above balanced, others scaled by 0.82: a developer with a signed tenant prices power into the lease, so cheap power is part of speed to revenue
  energy_carbon: 0.066
  water: 0.057
  climate_resilience: 0.066
  grid_infrastructure: 0.246
  land: 0.057
  community: 0.082
  permitting: 0.246
  cost: 0.18

pillar_floor_percentile: 10
pillar_floor_exempt: [permitting]       # three coarse state-level integers; one step moved a county 380 ranks

robustness:
  samples: 2000
  concentration: 20
  top_n: 10

portfolio:
  sites: 1
  diversity_keys: [state, grid_subregion]
  diversity_penalty: 0.3

output:
  top_n: 10
  explain: true
  include_excluded: true
